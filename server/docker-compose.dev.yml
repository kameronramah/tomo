# Serveur de développement LOCAL (Windows / macOS / Linux) — pas pour la production.
#   docker compose -f docker-compose.dev.yml up --build
# Puis dans l'appli : instance http://localhost:3000, crée un compte, puis un serveur.
services:
  livekit:
    image: livekit/livekit-server:latest
    # --dev : clés "devkey" / "secret", un seul port UDP (7882)
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  api:
    build: ./api
    environment:
      PORT: 3000
      DATA_DIR: /data
      JWT_SECRET: dev-seulement-ne-pas-utiliser-en-production-0123456789
      LIVEKIT_URL: ws://localhost:7880        # adresse donnée aux clients
      LIVEKIT_HTTP_URL: http://livekit:7880   # adresse vue depuis le conteneur
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      # Recherche de GIF : mets KLIPY_API_KEY=… dans server/.env (jamais dans ce fichier, il est sur GitHub)
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      # Stats de jeu (facultatif) : STEAM_API_KEY=… et RIOT_API_KEY=… dans server/.env
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      # Outils de test + compte de test (dev uniquement, jamais dans le docker-compose.yml de prod)
      DEV_TOOLS: "1"
      DEV_USERNAME: testeur
      DEV_PASSWORD: tomo-dev-7Rk2-Qp9x-Lm4v
    ports:
      - "3000:3000"
    volumes:
      - api-dev-data:/data
    depends_on:
      - livekit

volumes:
  api-dev-data:
