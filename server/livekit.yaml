# Configuration LiveKit — https://docs.livekit.io/home/self-hosting/deployment/
# Les clés API sont fournies via la variable LIVEKIT_KEYS (voir docker-compose.yml).

port: 7880            # signalisation (WebSocket), exposée via Caddy

rtc:
  tcp_port: 7881      # repli TCP quand l'UDP est bloqué
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

turn:
  enabled: true
  udp_port: 3478      # TURN intégré pour les réseaux restrictifs

room:
  empty_timeout: 300  # ferme un salon vide après 5 min
  max_participants: 25

logging:
  level: info
