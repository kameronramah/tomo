# Fabrique les installateurs de Tomo (Windows + Mac) sur les machines de GitHub.
#
# Comment s'en servir :
#  - Créer une version : `git tag v0.6.0` puis `git push origin v0.6.0`
#    → une « Release » brouillon apparaît sur GitHub avec les installateurs à télécharger.
#  - Ou à la main : onglet Actions > « Installateurs » > Run workflow.
#
# Un Mac est nécessaire pour fabriquer l'app Mac : c'est pour ça qu'on passe par GitHub.
name: Installateurs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            name: Windows
          - platform: macos-latest
            # Une seule app pour les Mac Intel et Apple (M1, M2…)
            args: "--target universal-apple-darwin"
            name: Mac
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Dépendances
        working-directory: client
        run: npm ci

      - name: Construire et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          args: ${{ matrix.args }}
          # Sans tag (lancement à la main), on garde juste les fichiers dans l'onglet Actions.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Tomo ${{ github.ref_name }}"
          releaseBody: |
            **Windows** : télécharge `Tomo_…_x64-setup.exe` et lance-le.
            **Mac** : télécharge `Tomo_…_universal.dmg`, ouvre-le et glisse Tomo dans Applications.
            Au premier lancement sur Mac : clic droit sur Tomo > Ouvrir (l'app n'est pas encore signée par Apple).
          releaseDraft: true

      - name: Garder les installateurs (lancement à la main)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Tomo-${{ matrix.name }}
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
