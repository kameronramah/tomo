[package]
name = "tomo"
version = "0.13.0"
description = "Tomo - le vocal pour jouer entre potes"
authors = ["Tomo contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png : pastille de notification dessinée par l'appli (surimpression de la barre des tâches)
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Coffre-fort du système (Gestionnaire d'identification Windows) pour la session « rester connecté »
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Notifications Windows / Mac, lancement au démarrage de l'ordinateur
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Lecture de la mémoire partagée « Mumble Link » (position du joueur dans son jeu)
[target.'cfg(windows)'.dependencies]
# Capture maison (essai) : memoire partagee WebView2 + capture integree a Windows
webview2-com = "0.39.1"
windows-core = "0.62"
base64 = "0.22"
windows-capture = "2.0.1"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps"] }

# Une seule fenêtre tomo à la fois (relancer tomo ramène la fenêtre déjà ouverte)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
